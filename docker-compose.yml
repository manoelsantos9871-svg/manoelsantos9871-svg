version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthtech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-healthtech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthtech_secret}
      POSTGRES_DB: ${DB_NAME:-healthtech_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-healthtech}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthtech_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthtech_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-healthtech}:${DB_PASSWORD:-healthtech_secret}@postgres:5432/${DB_NAME:-healthtech_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthtech_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    environment:
      VITE_API_URL: http://backend:3001/api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
